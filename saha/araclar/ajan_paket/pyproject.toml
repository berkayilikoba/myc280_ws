[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ajan"
version = "0.1.0"
description = "Lightweight Gemini (agy CLI) sub-agent orchestrator for Claude Code and automated workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ajan = "ajan:main"

[tool.setuptools]
# ajan.py tek dosyadır (single-file module).
# Kurulum öncesi saha/araclar/ajan.py dosyası paket köküne kopyalanmalıdır.
py-modules = ["ajan"]
