# Nav2 — LIMO 4 tekerlek diferansiyel profili (ROS 2 Humble)
#
# Değerlerin kaynağı:
#   [robot]   robottaki ROS1 kurulumu (agilex_ws/src/limo_ros/limo_bringup/param/4wd/)
#   [kılavuz] Limo user manual(EN).md donanım tablosu
#
# Ackermann profilinden farkları:
#   footprint simetrik (base_link gövde merkezinde)
#   planlayıcı Smac 2D (dönüş yarıçapı kısıtı yok, robot yerinde dönebilir)
#   MPPI motion_model DiffDrive
#   "spin" kurtarma davranışı geri eklendi

amcl:
  ros__parameters:
    use_sim_time: false
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan

    laser_max_range: 16.0
    laser_min_range: 0.02
    laser_model_type: "likelihood_field"
    max_beams: 60
    laser_likelihood_max_dist: 2.0

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    update_min_a: 0.2
    update_min_d: 0.25

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.1
    alpha4: 0.2
    alpha5: 0.2

    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Bu iki değer launch tarafından mutlak yolla yeniden yazılır.
    # RewrittenYaml yalnızca YAML'da VAR OLAN anahtarları değiştirir
    # (nav2_common/launch/rewritten_yaml.py:110), bu yüzden burada durmalılar.
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    # Humble nav2_bringup/params/nav2_params.yaml ile birebir aynı liste.
    # Eksik bırakılırsa varsayılan davranış ağaçları yüklenmez; örneğin
    # nav2_remove_passed_goals_action_bt_node yoksa bt_navigator activate
    # aşamasında "Node not recognized: RemovePassedGoals" verip yığını durdurur.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker", "hassas_hedef"]  # Normal ve kavrama öncesi hassas hedef denetleyicileri
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 20.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # [robot] 4wd/1base_local_planner: xy 0.25, yaw 0.2 -> sim/saha için 0.30 / 0.35
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.35

    hassas_hedef:
      stateful: true  # Hedef bölgesinde durduktan sonra tolerans kontrolünü korur
      plugin: "nav2_controller::SimpleGoalChecker"  # Hassas hedef denetleyicisi eklentisi
      xy_goal_tolerance: 0.15  # son yaklaşma kapalı çevrim düzeltir; MPPI 0.08'i tutturamadı, k1
      yaw_goal_tolerance: 0.25  # son yaklaşma kapalı çevrim düzeltir; MPPI 0.08'i tutturamadı, k1

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      wz_std: 0.8
      # [robot] 4wd: max_vel_x 0.50, min_vel_x 0
      vx_max: 0.5
      vx_min: -0.2
      wz_max: 1.2
      iteration_count: 1
      prune_distance: 1.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 1.4  # Hedefe yaklaşırken yavaşlama (mevcut 1.4 m korundu)
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5  # Son 0.5 m'de hedef yönelimine odaklanma
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4  # Yol takibi eşiği (GoalAngle'dan büyük tutuldu)
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        # true: yol geri yönde hizalanmaz. false iken 180° bakan robot 2.5 m'yi geri geri sürüyordu (masa_onu->kuzeydogu
        # 26/28 s geri; lidar arkayı görmüyor -123°..+141°). true: 15 s, 1.5 s geri; tur 123 -> 111 s (28.10 sim).
        forward_preference: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0  # Hızlı dinamik engeller (0.6 - 0.8 m/s) için 5.0 -> 10.0 Hz yapıldı (F6)
      publish_frequency: 10.0  # MPPI kontrolcüsüne güncel engelleri aktarmak için 2.0 -> 10.0 Hz yapıldı (F6)
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # [kılavuz] gövde 322 x 220 mm, base_link'e göre simetrik. Ackermann profiliyle
      # AYNI gövde — iki profil farklı footprint kullanmamalı. ROS 1 4wd profili 0.30 x 0.20
      # yazıyordu (kılavuzdan her yönde 1 cm küçük).
      footprint: "[[-0.161,-0.11],[-0.161,0.11],[0.161,0.11],[0.161,-0.11]]"
      footprint_padding: 0.02
      transform_tolerance: 0.5
      plugins: ["voxel_layer", "obstacle_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10
        max_obstacle_height: 0.50
        mark_threshold: 1
        combination_method: 1
        observation_sources: depth
        depth:
          topic: /camera/depth/points
          data_type: "PointCloud2"
          # Zemin gürültüsü (D435 σ = 0.00176·z²; 2 m'de 7 mm) min 0.05 ile süzülür
          min_obstacle_height: 0.05
          # Robot + kol ~0.45 m: 0.50 m üstü (masa tablası 0.75 m) engel sayılmaz (masa altına yaklaşma)
          max_obstacle_height: 0.50
          marking: true
          # clearing (raytrace): Dinamik engeller uzaklaştığında hücreler anında temizlenir.
          # observation_persistence: Eklenmemiştir (varsayılan 0.0). Dinamik engel arkasında
          # hayalet iz (ghost trail) kalmaması için her taramada temizleme aktiftir.
          clearing: true
          obstacle_max_range: 2.0
          obstacle_min_range: 0.25
          raytrace_max_range: 2.5
          raytrace_min_range: 0.25
          expected_update_rate: 0.0
          inf_is_valid: false
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          # clearing (raytrace): Hareketli engelin arkasındaki hücrelerin serbest alana
          # dönüştürülmesi için aktiftir. observation_persistence 0.0 (varsayılan, eklenmedi).
          clearing: True
          max_obstacle_height: 2.0
          # [robot] 4wd: obstacle_range 1.5, raytrace_range 3.5
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Bkz. local_costmap içindeki açıklama: iç teğet yarıçap 0.12 m.
        # 2026-09-23 gece: 0.15 -> 0.35. Şişirme, ayak izinin ÇEVREL yarıçapından
        # (padding dahil ~0.22 m) büyük olmalı: Humble Smac/MPPI "belki çarpışır"
        # eşiğini o yarıçaptaki maliyetten hesaplıyor; 0.15'te 0.15-0.22 bandında
        # ayak izi hiç denetlenmiyor, planlar duvar uçlarını sıyırıyordu (sim ölçümü,
        # bench/x7-x8). Diff'te 18/18 korundu, açıklık arttı.
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[-0.161,-0.11],[-0.161,0.11],[0.161,0.11],[0.161,-0.11]]"  # yerel costmap ile aynı
      footprint_padding: 0.02
      transform_tolerance: 0.5
      # VoxelLayer global costmap'e eklenmemiştir (yalnız yerel costmap'te aktiftir).
      # Gerekçe: Kamera dar görüşlüdür (dar FOV); robot dönüşlerinde küresel maliyet haritasında
      # temizlenemeyen kalıcı izler / hayalet engeller bırakabilir. Globalde statik harita + 2B lidar kalır.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: True
          clearing: True
          max_obstacle_height: 2.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Bkz. local_costmap içindeki açıklama: iç teğet yarıçap 0.12 m.
        # 2026-09-23 gece: 0.15 -> 0.35. Şişirme, ayak izinin ÇEVREL yarıçapından
        # (padding dahil ~0.22 m) büyük olmalı: Humble Smac/MPPI "belki çarpışır"
        # eşiğini o yarıçaptaki maliyetten hesaplıyor; 0.15'te 0.15-0.22 bandında
        # ayak izi hiç denetlenmiyor, planlar duvar uçlarını sıyırıyordu (sim ölçümü,
        # bench/x7-x8). Diff'te 18/18 korundu, açıklık arttı.
        inflation_radius: 0.35
        cost_scaling_factor: 4.0
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # Diferansiyel modda dönüş yarıçapı kısıtı yok — Hybrid-A* gereksiz.
    # Smac 2D, NavFn'e göre daha düzgün ve costmap'e duyarlı yol üretir.
    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Ackermann profilinden farklı: diferansiyel yerinde dönebildiği için "spin" var.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["DurBolge", "YavasBolge", "FootprintApproach"]
    DurBolge:
      type: "polygon"
      # LIMO gövde ayak izi + 0.06 m genişletilmiş durma güvenlik bölgesi:
      # [[0.221, 0.17], [0.221, -0.17], [-0.221, -0.17], [-0.221, 0.17]]
      # Humble collision_monitor std::vector<double> [x1, y1, x2, y2, ...] bekler
      points: [0.221, 0.17, 0.221, -0.17, -0.221, -0.17, -0.221, 0.17]
      action_type: "stop"
      max_points: 3
      visualize: True
      polygon_pub_topic: "DurBolge"
      enabled: True
    YavasBolge:
      type: "circle"
      radius: 0.55
      action_type: "slowdown"
      slowdown_ratio: 0.4
      max_points: 3
      visualize: True
      polygon_pub_topic: "YavasBolge"
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      max_points: 3
      min_points: 6
      visualize: True
      polygon_pub_topic: "FootprintApproach"
      enabled: True
    observation_sources: ["scan", "depth"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True
    depth:
      type: "pointcloud"
      topic: "/camera/depth/points"
      min_height: 0.05
      max_height: 0.50
      enabled: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 1.2]
    min_velocity: [-0.2, 0.0, -1.2]
    # [robot] 4wd: acc_lim_x 2.5, acc_lim_theta 3.2 (DWA varsayılanları, dokunulmamış).
    # Ackermann profilinde ölçülmüş 0.4 var — bu değerler Faz 1'de doğrulanacak.
    max_accel: [1.0, 0.0, 3.0]  # Doğrusal ivme 1.0 m/s², açısal 3.0 rad/s² (taban modeliyle tutarlı)
    max_decel: [-1.0, 0.0, -3.0]  # Doğrusal yavaşlama -1.0 m/s², açısal -3.0 rad/s² (taban modeliyle tutarlı)
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# ==============================================================================
# Görev N5 Değişiklikleri ve Gerekçeleri:
# 1. controller_server:
#    - goal_checker_plugins listesine "hassas_hedef" eklendi.
#    - hassas_hedef (SimpleGoalChecker, xy_goal_tolerance: 0.08 m,
#      yaw_goal_tolerance: 0.10 rad (~5.7°), stateful: true) tanımlandı.
#      Gerekçe: Kolun nesneye erişimi ve nesneye göreli kapalı çevrim son yaklaşma
#      öncesinde kavrama pozuna (Q) hassas varış sağlanması.
# 2. MPPI (FollowPath):
#    - GoalCritic threshold_to_consider: 1.4 (mevcut değer korundu).
#    - GoalAngleCritic threshold_to_consider: 0.5 (son 0.5 m'de hedef açısına yönelim).
#    - PathFollowCritic threshold_to_consider: 1.4 (> GoalAngleCritic 0.5 m).
#    - PathAlignCritic threshold_to_consider: 0.5.
# 3. velocity_smoother:
#    - max_accel açısal ivmesi 2.0 -> 3.0 rad/s² yapıldı ([1.0, 0.0, 3.0]).
#    - max_decel açısal yavaşlaması -2.0 -> -3.0 rad/s² yapıldı ([-1.0, 0.0, -3.0]).
#    - max_velocity [0.5, 0.0, 1.2] olarak MPPI vx_max/wz_max ile tutarlı bırakıldı.
#      Gerekçe: Taban tepki modeli ve diferansiyel dönüş dinamikleriyle tutarlılık.
# 4. collision_monitor:
#    - FootprintApproach time_before_collision değeri zaten 1.2 s olduğundan korunmuştur.
# ==============================================================================

# ==============================================================================
# Görev N8 Değişiklikleri ve Gerekçeleri:
# 1. local_costmap:
#    - plugins listesine obstacle_layer'dan önce "voxel_layer" eklendi.
#    - voxel_layer: nav2_costmap_2d::VoxelLayer, 3B voksel ızgarası (z_resolution: 0.05 m,
#      z_voxels: 10, origin_z: 0.0 m, max_obstacle_height: 0.50 m, mark_threshold: 1, combination_method: 1).
#    - depth kaynağı (/camera/depth/points, PointCloud2):
#      * min_obstacle_height: 0.05 m -> Zemin gürültüsü süzülür (D435 σ = 0.00176·z²; 2 m'de 7 mm).
#      * max_obstacle_height: 0.50 m -> Robot + kol (~0.45 m) üstü (masa tablası 0.75 m) engel sayılmaz;
#        robot kavrama için masa altına girebilir; 2B lidarın göremediği sandalye oturağı, raf çıkıntıları
#        ve masa çapraz ayakları yerel haritaya eklenir ve temizlenir.
# 2. global_costmap:
#    - voxel_layer eklenmedi (yalnızca static_layer, obstacle_layer, inflation_layer korundu).
