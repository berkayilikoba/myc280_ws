# robot_localization EKF — Gazebo simülasyonu (limo_description/gazebo_limo_mycobot.launch.py)
#
# Simdeki farklar (gerçek robota göre):
#   * diff_drive eklentisi /odom yayınlıyor, child_frame base_footprint, 50 Hz
#   * IMU /imu/data, imu_link, 100 Hz
#   * eklenti odom -> base_footprint TF'ini kendisi yayınlıyor (publish_odom_tf=true),
#     bu yüzden EKF TF yayınlamaz; çıktısı yalnızca /odometry/filtered.
# Füzyon yapılandırması ekf_robot.yaml ile aynı tutulur ki sim sonuçları karşılaştırılabilsin.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false
    publish_acceleration: false
    publish_tf: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    imu0: imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
